name: Build AuraPitch Pro (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake + Visual Studio)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_BUILD_EXTRAS=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target AuraPitchPro_VST3 --parallel

      - name: Build Standalone
        run: cmake --build build --config Release --target AuraPitchPro_Standalone --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AuraPitchPro-VST3-Windows
          path: build/AuraPitchPro_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: AuraPitchPro-Standalone-Windows
          path: build/AuraPitchPro_artefacts/Release/Standalone/
          if-no-files-found: error
